name: dopewars_flutter
description: "A drug dealing simulation game ported to Flutter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6

  # Dependency injection
  get_it: ^8.0.3

  # Routing
  go_router: ^14.8.1

  # Value equality
  equatable: ^2.0.7

  # Functional programming (Either type for error handling)
  dartz: ^0.10.1

  # Local storage
  shared_preferences: ^2.3.5

  # UUID generation
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Bloc testing
  bloc_test: ^9.1.7

  # Mocking
  mocktail: ^1.0.4

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
